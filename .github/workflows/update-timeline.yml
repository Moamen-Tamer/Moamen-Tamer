name: Update profile timeline

on:
  workflow_dispatch:
  push:
    paths:
      - timeline.tsv
      - scripts/generate_timeline.sh
      - .github/workflows/update-timeline.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate timeline
        run: bash scripts/generate_timeline.sh

      - name: Commit generated README
        uses: EndBug/add-and-commit@v9
        with:
          message: Update backend development timeline
          default_author: github_actions
